<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLY demo chat</title>
<style>
  :root { --bg:#f5f7f9; --card:#fff; --fg:#15202b; --muted:#5a6878; --line:#cbd3dc; --accent:#0e7782; --warn:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1419; --card:#151d25; --fg:#e5eaf0; --muted:#98a6b5; --line:#2d3946; --accent:#45b9c3; --warn:#f97066; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header b { font-size:17px; } header span { color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:72ch; padding:8px 12px; border-radius:10px; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--accent); color:#fff; }
  .gly { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
  .err { align-self:flex-start; color:var(--warn); }
  .card { align-self:flex-start; background:var(--card); border:1px solid var(--accent); border-radius:10px; padding:12px; max-width:520px; }
  .card h4 { margin:0 0 6px; } .card .row { display:flex; justify-content:space-between; gap:12px; font-size:14px; padding:2px 0; }
  .card button { margin-top:8px; margin-right:8px; padding:6px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  .card button.secondary { background:transparent; color:var(--accent); }
  .src { font-size:12px; color:var(--muted); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; }
  form button { padding:10px 18px; border-radius:8px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<header><b>GLY demo</b><span>ARB and PULSE are simulated. Every product and price is made up.</span></header>
<div id="log"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Try: find me headphones under $200"><button>Send</button></form>
<script>
const log = document.getElementById("log");
const sessionId = sessionStorage.getItem("gly-session") || ("s_" + Math.random().toString(36).slice(2, 10));
sessionStorage.setItem("gly-session", sessionId);
const ws = new WebSocket(`ws://${location.host}/chat?sessionId=${sessionId}&userId=demo_user`);
const streams = {};
const money = (m) => `${m.currency} ${m.value.toFixed(2)}`;
const add = (cls, text) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; log.append(d); log.scrollTop = log.scrollHeight; return d; };

function card(c) {
  const d = document.createElement("div"); d.className = "card";
  const h = document.createElement("h4"); d.append(h);
  const row = (a, b) => { const r = document.createElement("div"); r.className = "row"; r.innerHTML = "<span></span><span></span>"; r.children[0].textContent = a; r.children[1].textContent = b; d.append(r); };
  if (c.kind === "product_results") { h.textContent = "Results: " + c.title; c.products.forEach(p => row(`${p.title} · ${p.merchant}`, money(p.price))); }
  else if (c.kind === "approval") {
    h.textContent = "Approve purchase?"; row(c.title, c.merchant); row("List price", money(c.listPrice));
    if (c.couponApplied) row("Coupon", c.couponApplied); row("You pay", money(c.finalPrice));
    row("Offer expires", new Date(c.expiresAt).toLocaleTimeString());
    for (const [label, decision] of [["Approve", "approve"], ["Reject", "reject"]]) {
      const b = document.createElement("button"); b.textContent = label; if (decision === "reject") b.className = "secondary";
      b.onclick = () => { ws.send(JSON.stringify({ type: "approval", proposalId: c.proposalId, decision })); d.querySelectorAll("button").forEach(x => x.disabled = true); };
      d.append(b);
    }
  }
  else if (c.kind === "payment_receipt") { h.textContent = "Receipt " + c.receiptId; row(c.merchant, money(c.amount)); row("Status", c.status); }
  else if (c.kind === "transactions") { h.textContent = c.summary; c.rows.forEach(r => row(`${r.date} · ${r.description}`, money(r.amount))); }
  else if (c.kind === "error") { h.textContent = c.title; row(c.detail, ""); }
  log.append(d); log.scrollTop = log.scrollHeight;
}

ws.onmessage = (ev) => {
  const e = JSON.parse(ev.data);
  if (e.type === "message") add("gly", e.text);
  else if (e.type === "error") add("err", e.text);
  else if (e.type === "token") { (streams[e.streamId] ||= add("gly", "")).textContent += e.text; log.scrollTop = log.scrollHeight; }
  else if (e.type === "stream_end") {
    const el = streams[e.streamId]; if (el && e.sources.length) { const s = document.createElement("div"); s.className = "src";
      e.sources.forEach(x => { const a = document.createElement("div"); a.textContent = `[${x.n}] ${x.title} — ${x.url}`; s.append(a); }); el.append(s); }
  }
  else if (e.type === "card") card(e.card);
};
ws.onclose = () => add("err", "Disconnected from GLY.");
document.getElementById("f").onsubmit = (ev) => {
  ev.preventDefault(); const t = document.getElementById("t"); if (!t.value.trim()) return;
  add("me", t.value); ws.send(JSON.stringify({ type: "user_message", text: t.value })); t.value = "";
};
</script>
</body>
</html>
